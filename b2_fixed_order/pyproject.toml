[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recursive-ridge-b2"
version = "0.1.0"
description = "Fixed-order recursive centered Ridge B2 for auditable class-incremental learning"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
